<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SEMKA DROP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070b;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:18px 12px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-weight:900;font-size:28px;letter-spacing:1px}.logo span{color:#a855f7}
.balance{background:#15131d;border:1px solid #30253e;border-radius:14px;padding:9px 12px;font-weight:800;color:#d8b4fe}
.case{background:linear-gradient(180deg,#15121d,#0d0c12);border:1px solid #29212f;border-radius:20px;padding:16px;box-shadow:0 15px 50px #000}
.title{text-align:center;font-size:20px;font-weight:900;margin:2px 0 14px}
.roller-wrap{position:relative;overflow:hidden;border-radius:15px;background:#08080c;border:1px solid #27232d;height:150px}
.roller-wrap:before,.roller-wrap:after{content:"";position:absolute;z-index:3;top:0;height:100%;width:70px;pointer-events:none}
.roller-wrap:before{left:0;background:linear-gradient(90deg,#08080c,transparent)}
.roller-wrap:after{right:0;background:linear-gradient(-90deg,#08080c,transparent)}
.marker{position:absolute;z-index:5;left:50%;top:0;transform:translateX(-50%);height:100%;width:3px;background:#fff;box-shadow:0 0 15px #fff}
.marker:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #fff}
.track{height:100%;display:flex;align-items:center;gap:10px;padding-left:calc(50% - 58px);will-change:transform}
.item{flex:0 0 116px;height:116px;border-radius:14px;border:2px solid #333;background:#15151b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.seed{font-size:42px}.name{font-size:12px;font-weight:900}.rarity{font-size:10px;font-weight:900;text-transform:uppercase}
.common{border-color:#777}.common .rarity{color:#aaa}.rare{border-color:#3b82f6}.rare .rarity{color:#60a5fa}.epic{border-color:#a855f7;box-shadow:0 0 12px #7e22ce55}.epic .rarity{color:#c084fc}.legendary{border-color:#f59e0b;box-shadow:0 0 16px #f59e0b55}.legendary .rarity{color:#fbbf24}
button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,#7e22ce,#a855f7);color:white;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 8px 25px #7e22ce44}
button:disabled{opacity:.5}.cost{text-align:center;margin-top:9px;color:#9ca3af;font-size:13px}
.result{display:none;text-align:center;margin-top:18px;padding:16px;border-radius:16px;background:#121018;border:1px solid #2e2638}.result.show{display:block;animation:pop .35s ease}
.result .big{font-size:52px}.result h2{margin:5px 0}.price{font-size:20px;font-weight:900;color:#fbbf24}.hint{color:#8d8796;font-size:12px;margin-top:10px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">SEMKA <span>DROP</span></div>
    <div class="balance">🪙 <span id="balance">44095</span> GOLD</div>
  </div>
  <div class="case">
    <div class="title">ОТКРЫТИЕ КЕЙСА</div>
    <div class="roller-wrap">
      <div class="marker"></div>
      <div class="track" id="track"></div>
    </div>
    <button id="spin">КРУТИТЬ — 500 GOLD</button>
    <div class="cost">Открытие по принципу кейса: лента → замедление → приз в центре</div>
    <div class="result" id="result">
      <div class="big" id="resultIcon">🌱</div>
      <h2 id="resultName">Семка</h2>
      <div id="resultRarity">РЕДКАЯ</div>
      <div class="price">🪙 <span id="resultPrice">0</span> GOLD</div>
      <div class="hint">Приз выпал из SEMKA DROP</div>
    </div>
  </div>
</div>
<script>
const prizes=[
 {name:"Обычная семка",rarity:"Обычная",cls:"common",price:100},
 {name:"Синяя семка",rarity:"Редкая",cls:"rare",price:750},
 {name:"Фиолетовая семка",rarity:"Эпическая",cls:"epic",price:2500},
 {name:"Золотая семка",rarity:"Легендарная",cls:"legendary",price:10000},
 {name:"Тёмная семка",rarity:"Эпическая",cls:"epic",price:4200},
 {name:"Неоновая семка",rarity:"Легендарная",cls:"legendary",price:25000}
];
const track=document.getElementById('track'), balanceEl=document.getElementById('balance');
const result=document.getElementById('result'), btn=document.getElementById('spin');
let balance=44095, busy=false;

function makeItem(p){
 const d=document.createElement('div'); d.className='item '+p.cls;
 d.innerHTML=`<div class="seed">🌱</div><div class="name">${p.name}</div><div class="rarity">${p.rarity}</div>`;
 return d;
}
function fill(){
 track.innerHTML='';
 for(let i=0;i<45;i++) track.appendChild(makeItem(prizes[Math.floor(Math.random()*prizes.length)]));
}
fill();

btn.onclick=()=>{
 if(busy || balance<500)return;
 busy=true; btn.disabled=true; result.classList.remove('show');
 balance-=500; balanceEl.textContent=balance.toLocaleString('ru-RU');
 fill();

 // Выбираем приз заранее и ставим его в точку остановки.
 const targetIndex=31;
 const winner=prizes[Math.floor(Math.random()*prizes.length)];
 track.replaceChild(makeItem(winner),track.children[targetIndex]);

 const itemW=126, center=targetIndex*itemW;
 const jitter=(Math.random()*30-15);
 const distance=center+jitter;
 track.style.transition='none';
 track.style.transform='translateX(0)';
 requestAnimationFrame(()=>{
   track.style.transition='transform 5.2s cubic-bezier(.08,.72,.12,1)';
   track.style.transform=`translateX(${-distance}px)`;
 });
 setTimeout(()=>{
   document.getElementById('resultIcon').textContent='🌱';
   document.getElementById('resultName').textContent=winner.name;
   document.getElementById('resultRarity').textContent=winner.rarity.toUpperCase();
   document.getElementById('resultPrice').textContent=winner.price.toLocaleString('ru-RU');
   result.classList.add('show');
   btn.disabled=false; busy=false;
 },5400);
};
</script>
</body>
</html>
